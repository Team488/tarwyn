syntax = "proto3";

package protobuf;

option optimize_for = SPEED;

message StringList {
  repeated string values = 1;
}

message FloatList {
  repeated float values = 1;
}

message BytesList {
  repeated bytes values = 1;
}

message BoolList {
  repeated bool values = 1;
}

message DoubleList {
  repeated double values = 1;
}

message IntegerList {
  repeated int32 values = 1;
}

message LongList {
  repeated int64 values = 1;
}

message Coordinate {
  double x = 1;
  double y = 2;
}

message CoordinateList {
  repeated Coordinate coordinates = 1;
}

enum RobotDirection {
  FRONT = 0;
  BACK = 1;
}

message ControlPoint {
  double x = 1;
  double y = 2;
  optional double rotation_degrees = 3;
}

message BezierCurve {
  repeated ControlPoint control_points = 1;
}

message TraversalOptions {
  optional double meters_per_second = 1;
  optional double final_rotation_degrees = 2;
  optional double acceleration_meters_per_second = 3;
  optional bool face_nearest_reef_april_tag = 4;
  optional double end_face_nearest_reef_april_tag_path_threshold_percentage = 5;
  optional RobotDirection face_nearest_reef_april_tag_direction = 6;
  optional double final_rotation_turn_speed_factor = 7;
  optional double start_face_nearest_reef_april_tag_path_threshold_percentage = 8;
  optional bool snap_to_nearest_april_tag = 9;
  optional double april_tag_rotation_degrees_turn_speed_factor_per_step = 10;
}

message BezierCurves {
  repeated BezierCurve curves = 1;
  optional TraversalOptions options = 2;
}

message BezierCurvesList {
  repeated BezierCurves values = 1;
}

message SupportedValues {
  oneof kind {
    string string = 1;
    int32 int32 = 2;
    int64 int64 = 3;
    uint32 uint32 = 4;
    uint64 uint64 = 5;
    bool bool = 6;
    double double = 7;
    float float = 8;
    bytes bytes = 9;
    StringList string_list = 10;
    FloatList float_list = 11;
    BytesList bytes_list = 12;
    BoolList bool_list = 13;
    DoubleList double_list = 14;
    IntegerList integer_list = 15;
    LongList long_list = 16;
    CoordinateList coordinate_list = 17;
    BezierCurve bezier_curve = 18;
    BezierCurves bezier_curves = 19;
    BezierCurvesList bezier_curves_list = 20;
  }
}

message SendDataCommand {
  string channel = 1;
  SupportedValues value = 2;
}

message GetDataCommand {
  string channel = 2;
}

message GetLogsCommand {
}

message RegisterTelemetryCommand {
  string channel = 1;
  string address = 2;
}

message ReplyTelemetryCommand {
  bool registered = 1;
}

message ReplyDataCommand {
  SupportedValues value = 2;
}

message ReplyLogsCommand {
  repeated string logs = 1;
}

message RegisterCommand {
  string machine_name = 1;
}

message DeleteCommand {
  string channel = 1;
}

message ReplyDeleteCommand {
  uint32 deleted = 1;
}

message ListTablesCommand {
  string prefix = 1;
}

message ReplyTablesCommand {
  repeated string channels = 1;
}

message PingCommand {
  uint64 sent_nanos = 1;
}

message ReplyPingCommand {
  uint64 sent_nanos = 1;
  uint64 server_nanos = 2;
}

message StatisticsCommand {
}

message ReplyStatisticsCommand {
  uint64 channels = 1;
  uint64 values = 2;
  uint64 telemetry_subscribers = 3;
  uint64 uptime_seconds = 4;
  string version = 5;
}

message JsonCommand {
  string prefix = 1;
}

message ReplyJsonCommand {
  string json = 1;
}

message CompareAndSetCommand {
  string channel = 1;
  SupportedValues expected = 2;
  SupportedValues value = 3;
  bool expect_absent = 4;
}

message ReplyCompareAndSetCommand {
  bool swapped = 1;
  SupportedValues current = 2;
}

message SendLogsCommand {
  repeated string logs = 1;
}

message Push {
  oneof Payload {
    SendDataCommand send = 1;
  }
}

message Publish {
  oneof Payload {
    SendDataCommand data = 1;
    SendLogsCommand logs = 2;
  }
}

message Request {
  oneof Payload {
    GetDataCommand data = 1;
    GetLogsCommand logs = 2;
    RegisterTelemetryCommand register_telemetry = 3;
    DeleteCommand delete = 4;
    ListTablesCommand tables = 5;
    PingCommand ping = 6;
    StatisticsCommand statistics = 7;
    JsonCommand json = 8;
    CompareAndSetCommand compare_and_set = 9;
  }
}

message Reply {
  oneof Payload {
    ReplyDataCommand data = 1;
    ReplyLogsCommand logs = 2;
    ReplyTelemetryCommand telemetry = 3;
    ReplyDeleteCommand delete = 4;
    ReplyTablesCommand tables = 5;
    ReplyPingCommand ping = 6;
    ReplyStatisticsCommand statistics = 7;
    ReplyJsonCommand json = 8;
    ReplyCompareAndSetCommand compare_and_set = 9;
  }
}
