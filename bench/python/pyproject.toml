[project]
name = "tarwyn-bench"
version = "0.0.0"
description = "The ntcore server and probe the benchmark drives through uv."
requires-python = ">=3.11,<3.15"
dependencies = ["pyntcore==2027.0.0a7"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
