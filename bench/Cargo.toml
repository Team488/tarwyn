[package]
name = "bench"
version = "0.1.0"
edition = "2024"
description = "Latency and throughput harness for tarwyn-rust and its alternatives."
publish = false

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
hdrhistogram = { version = "7.6", default-features = false }
clap = { version = "4.6", features = ["derive"] }
tungstenite = "0.30"
serde_json = "1"
tarwyn_client = { path = "../client" }
tarwyn_protobuf = { path = "../proto" }
tarwyn_server = { path = "../core" }
