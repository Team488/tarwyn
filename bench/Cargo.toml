[package]
name = "bench"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Latency and throughput harness for tarwyn and its alternatives."
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
hdrhistogram = { version = "7.6", default-features = false }
clap = { version = "4.6", features = ["derive"] }
tungstenite = "0.30"
serde_json = "1"
tarwyn_client = { path = "../client", version = "0.1.1" }
tarwyn_server = { path = "../core", version = "0.1.1" }
