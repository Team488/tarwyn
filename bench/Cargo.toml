[package]
name = "bench"
version = "0.0.3"
edition = "2024"
description = "Latency and throughput harness for tarwyn-rust and its alternatives."
publish = false

[dependencies]
zmq = "0.10.0"
prost = "0.14.4"
hdrhistogram = { version = "7.6", default-features = false }
clap = { version = "4.6", features = ["derive"] }
tarwyn_client = { path = "../clients/rust" }
tarwyn_protobuf = { path = "../proto", version = "0.0.3" }
