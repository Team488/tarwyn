[package]
name = "tarwyn_python"
version = "0.1.1"
edition = "2024"
rust-version.workspace = true
description = "The native module under the tarwyn python package."
license = "MIT"
publish = false

[lib]
name = "_tarwyn"
crate-type = ["cdylib"]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module", "generate-import-lib"] }
tarwyn_client = { path = "../../client", version = "0.1.1" }
