[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "tarwyn"
version = "0.1.1"
description = "Python client for the tarwyn key/value server"
license = "MIT"
requires-python = ">=3.11,<3.15"

dependencies = ["robotpy-wpimath>=2027.0.0a7,<2028"]

[tool.maturin]
module-name = "tarwyn._tarwyn"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyntcore==2027.0.0a7",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
