[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "tarwyn"
version = "0.1.0"
description = "Python client for the tarwyn key/value server"
license = "MIT"
requires-python = ">=3.11,<3.15"

dependencies = ["robotpy-wpimath>=2026.2.2"]

[tool.maturin]
bindings = "uniffi"
python-source = "python"

[tool.uv]
no-editable = true

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyntcore==2026.2.2",
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/protocol"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
