[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyntcore==2026.2.2",
    "robotpy-wpimath==2026.2.2",
    "ruff==0.16.5",
    "setuptools>=68",
]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/protocol"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
