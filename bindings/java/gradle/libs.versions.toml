[versions]
wpilib = "2027.0.0-alpha-7"
junit = "6.1.3"
junit-platform = "6.1.3"
quickbuf = "1.4"

[libraries]
wpilib-wpiutil = { module = "org.wpilib.wpiutil:wpiutil-java", version.ref = "wpilib" }
wpilib-wpimath = { module = "org.wpilib.wpimath:wpimath-java", version.ref = "wpilib" }
wpilib-wpiunits = { module = "org.wpilib.wpiunits:wpiunits-java", version.ref = "wpilib" }
quickbuf = { module = "us.hebi.quickbuf:quickbuf-runtime", version.ref = "quickbuf" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
