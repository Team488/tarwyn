org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

maven_group = org.tarwyn
wpilib_version = 2026.2.1
jextract_version = 25
jextract_build = 2-4

# wpilib_version tracks the latest cut WPILib release, not frcmaven's <latest>.
# Maven carries 2026.2.2, which was never released — allwpilib's newest non-
# prerelease tag is v2026.2.1, and that is what teams actually run.
# The benchmark pins 2025.3.2 separately: 2026 publishes no JNI classifiers at
# all, so the NT4 subject cannot load. The client needs no JNI.
wpilib_bench_version = 2025.3.2
tarwyn_jar_version = v5.0.0
jackson_version = 2.22.2
