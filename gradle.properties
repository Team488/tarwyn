org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

maven_group = org.tarwyn
wpilib_version = 2027.0.0-alpha-7
jextract_version = 25
junit_version = 5.11.4
jextract_build = 2-4

# The client targets 2027 and SystemCore only. WPILib 2027 moved its group from
# edu.wpi.first to org.wpilib and its packages to org.wpilib.*, so the two lines
# cannot be mixed. 2026 is not a target: the Java client needs FFM, which needs
# JDK 22+, and WPILib 2026 is JDK 17.
# The benchmark pins 2025.3.2 separately: it measures the NT4 incumbent, still
# under the old group, and 2026 publishes no JNI classifiers so it cannot load.
wpilib_bench_version = 2025.3.2
tarwyn_jar_version = v5.0.0
# jackson-annotations reports <latest>3.0-rc5 and its 2.x line stops before
# databind's, so this is the highest version all three artifacts share.
jackson_version = 2.19.2
