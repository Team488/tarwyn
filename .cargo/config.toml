[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-pc-windows-msvc]
# ponytail: /FORCE:MULTIPLE allows the JNI WHOLEARCHIVE link to dedupe
# bcryptprimitives which appears twice in the LTO fat staticlib (rustls/ring
# via tungstenite's transitive deps). Without it clang-cl fails with LNK2005
# on windows-x86_64. If the dup goes away, this can be removed.
rustflags = ["-C", "link-arg=/FORCE:MULTIPLE"]
