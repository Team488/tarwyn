    benchNatives "edu.wpi.first.ntcore:ntcore-jni:${project.wpilib_bench_version}:linuxx86-64"
    benchNatives "edu.wpi.first.wpiutil:wpiutil-jni:${project.wpilib_bench_version}:linuxx86-64"
