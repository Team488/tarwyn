import java.security.MessageDigest

plugins {
    id 'java-library'
}

group = project.maven_group
version = providers.provider {
    def manifest = file('core/Cargo.toml').text
    def matcher = manifest =~ /(?m)^version\s*=\s*"([^"]+)"/
    matcher.find() ? matcher.group(1) : '0.0.0'
}.get()

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs <<
        '-Xlint:all,-serial,-this-escape,-processing,-restricted,-auxiliaryclass'
}

repositories {
    mavenCentral()
    maven {
        name = 'WPILib'
        url = 'https://frcmaven.wpi.edu/artifactory/release'
    }
    ivy {
        name = 'TARWYN releases'
        url = 'https://github.com/Team488/tarwyn/releases/download'
        patternLayout {
            artifact '[revision]/[module].[ext]'
        }
        metadataSources {
            artifact()
        }
        content {
            includeGroup 'org.team488'
        }
    }
}

sourceSets {
    bench {
        java {
            srcDirs = ['bench/java']
        }
    }
}

configurations {
    benchNatives
}

dependencies {
    testImplementation libs.junit.jupiter
    testImplementation libs.wpilib.wpimath
    testImplementation libs.wpilib.wpiunits
    testImplementation libs.wpilib.wpiutil
    testRuntimeOnly libs.quickbuf
    testRuntimeOnly libs.junit.platform.launcher

    benchImplementation libs.wpilib.bench.ntcore
    benchImplementation libs.wpilib.bench.wpiutil
    benchImplementation "org.team488:TARWYN:${libs.versions.tarwyn.jar.get()}@jar"
    benchRuntimeOnly libs.jackson.core
    benchRuntimeOnly libs.jackson.databind
    benchRuntimeOnly libs.jackson.annotations

    benchNatives "edu.wpi.first.ntcore:ntcore-jni:${libs.versions.wpilib.bench.get()}:linuxx86-64"
    benchNatives "edu.wpi.first.wpiutil:wpiutil-jni:${libs.versions.wpilib.bench.get()}:linuxx86-64"
}

def generatedJava = layout.projectDirectory.dir('bindings/dist/java')
def generatedNatives = generatedJava.dir('native')
def nativesDir = layout.buildDirectory.dir('natives')
def prebuiltNatives = layout.projectDirectory.dir('bindings/natives')

sourceSets {
    main {
        java {
            srcDirs = [generatedJava]
            exclude 'jni/**', 'native/**'
        }
    }
    test {
        java {
            srcDirs = ['bindings/tests/java']
        }
    }
}

javadoc {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

def hostPlatform() {
    def os = org.gradle.internal.os.OperatingSystem.current()
    def arch = System.getProperty('os.arch')
    def name = arch in ['amd64', 'x86_64'] ? 'x86_64' : (arch.contains('aarch') ? 'aarch64' : arch)
    if (os.isLinux()) {
        return "linux-${name}"
    }
    if (os.isWindows()) {
        return "windows-${name}"
    }
    if (os.isMacOsX()) {
        def macArch = name == "aarch64" ? "arm64" : name
        return "darwin-${macArch}"
    }
    throw new GradleException("no native packaging rule for ${os.name} ${arch}")
}

tasks.register('boltffiPack', Exec) {
    description = 'Generates the Java client and builds the JNI native it loads.'
    workingDir = layout.projectDirectory.dir('bindings').asFile
    commandLine 'boltffi', 'pack', 'java', '--release'
    environment 'JAVA_HOME', System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
    outputs.dir(generatedJava)
    outputs.upToDateWhen { false }
}

tasks.named('compileJava').configure { dependsOn tasks.named('boltffiPack') }
tasks.named('sourcesJar').configure { dependsOn tasks.named('boltffiPack') }

def stageNative = { File root, String platform, File source ->
    def destination = new File(root, platform)
    destination.mkdirs()
    def library = new File(destination, source.name)
    library.bytes = source.bytes
    def hex = MessageDigest.getInstance('SHA-256')
        .digest(library.bytes).collect { String.format('%02x', it) }.join()
    new File(destination, "${library.name}.sha256").text = hex
    return "${platform}/${library.name} (${library.length()} bytes, sha256 ${hex.take(16)}...)"
}

tasks.register('packageNative') {
    description = 'Stages every available native as a jar resource with a checksum beside it.'
    dependsOn tasks.named('boltffiPack')
    def target = nativesDir.map { it.dir('natives') }
    inputs.files(fileTree(generatedNatives))
    inputs.files(fileTree(prebuiltNatives))
    outputs.dir(target)
    outputs.upToDateWhen { false }

    doLast {
        def root = target.get().asFile
        root.deleteDir()

        def staged = 0
        [generatedNatives.asFile, prebuiltNatives.asFile].each { directory ->
            if (!directory.isDirectory()) {
                return
            }
            directory.eachDir { candidate ->
                candidate.eachFile { library ->
                    if (library.name.contains('_jni.')) {
                        logger.lifecycle("staged ${stageNative(root, candidate.name, library)}")
                        staged++
                    }
                }
            }
        }
        if (staged == 0) {
            throw new GradleException("no natives under ${generatedNatives.asFile}")
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('packageNative')
    from(nativesDir)
}

def benchNativesDir = layout.buildDirectory.dir('bench-natives')

tasks.register('extractBenchNatives', Copy) {
    description = 'Unpacks the WPILib JNI libraries the NT4 subject loads at runtime.'
    from({ configurations.benchNatives.collect { zipTree(it) } }) {
        include '**/*.so'
        exclude '**/debug/**'
        eachFile { it.path = it.name }
    }
    includeEmptyDirs = false
    into benchNativesDir
}

tasks.register('benchEnv') {
    description = 'Writes the benchmark classpath and native path for bench/generate.sh.'
    dependsOn tasks.named('benchClasses'), tasks.named('extractBenchNatives')
    def target = layout.buildDirectory.file('bench-env.sh')
    outputs.file(target)

    doLast {
        def classpath = (sourceSets.bench.output.classesDirs.files
            + configurations.benchRuntimeClasspath.files).join(':')
        def tarwynJar = configurations.benchRuntimeClasspath.files
            .find { it.name.startsWith('TARWYN') }?.absolutePath ?: ''
        target.get().asFile.text = """BENCH_CP='${classpath}'
BENCH_NATIVES='${benchNativesDir.get().asFile.absolutePath}'
BENCH_TARWYN_JAR='${tarwynJar}'
BENCH_WPILIB_VERSION='${libs.versions.wpilib.bench.get()}'
BENCH_TARWYN_VERSION='${libs.versions.tarwyn.jar.get()}'
"""
        logger.lifecycle("wrote ${target.get().asFile}")
    }
}

tasks.named('test', Test) {
    dependsOn tasks.named('packageNative')
    useJUnitPlatform()
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
    systemProperty 'java.library.path',
        generatedNatives.dir(hostPlatform()).asFile.absolutePath
    testLogging {
        events 'passed', 'failed'
    }
}
