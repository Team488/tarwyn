[workspace]
resolver = "3"
members = [
    "core",
    "client",
    "proto",
    "bench",
    "bindings/c",
    "bindings/python",
    "xtask",
]

[workspace.package]
rust-version = "1.88"

[workspace.lints.rust]
missing_debug_implementations = "deny"

[workspace.lints.clippy]
redundant_clone = "deny"
needless_collect = "deny"
large_enum_variant = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
