[package]
name = "tarwyn_client"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Rust client for the tarwyn key/value server: WebSocket publishes, reads and control, plus UDP telemetry."
license = "MIT"

[lints]
workspace = true

[dependencies]
thiserror = "2.0"
tarwyn_protobuf = { path = "../proto", version = "0.1.1" }
tarwyn_server = { path = "../core", version = "0.1.1" }
prost = "0.14.4"
slotmap = "1.1"
tungstenite = "0.30"
serde_json = "1"
