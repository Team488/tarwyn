[package]
name = "tarwyn_server"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Key/value server for FRC robots that speaks NetworkTables 4.1 over WebSocket, with a UDP telemetry plane."
license = "MIT"

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
clap = { version = "4.6", features = ["derive"] }
log = { version = "0.4.34", features = ["std"] }
arc-swap = "1.9"
thiserror = "2.0"
serde_json = "1"
data-encoding = "2.11"
tungstenite = "0.30"
tarwyn_protobuf = { path = "../proto", version = "0.1.1" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
