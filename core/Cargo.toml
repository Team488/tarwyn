[package]
name = "tarwyn_server"
version = "0.1.0"
edition = "2024"
description = "A Rust server for managing tarwyn over ZeroMQ."
license = "MIT"

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
clap = { version = "4.6", features = ["derive"] }
log = { version = "0.4.34", features = ["std"] }
arc-swap = "1.9"
thiserror = "2.0"
serde_json = "1"
tungstenite = "0.30"
tarwyn_protobuf = { path = "../proto", version = "0.1.0" }
