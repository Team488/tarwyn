name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Get version from manifest
        id: get_version
        run: |
          PACKAGE_VERSION=$(./scripts/get-version.sh)
          echo "value=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT

  dry-run:
    name: Dry-run
    needs: ["init"]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Publish (dry-run)
      uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
      with:
        dry-run: true
        check-repo: true
        registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    needs: ["init", "dry-run"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner-os: windows-2022
            artifact-name: tarwyn-${{ needs.init.outputs.version }}-windows-x86_64
            cargo-target: x86_64-pc-windows-msvc

          - name: Windows aarch64
            runner-os: windows-11-arm
            artifact-name: tarwyn-${{ needs.init.outputs.version }}-windows-aarch64
            cargo-target: aarch64-pc-windows-msvc

          - name: Linux x86_64
            runner-os: ubuntu-22.04
            artifact-name: tarwyn-${{ needs.init.outputs.version }}-linux-x86_64
            cargo-target: x86_64-unknown-linux-gnu

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            artifact-name: tarwyn-${{ needs.init.outputs.version }}-linux-aarch64
            cargo-target: aarch64-unknown-linux-gnu

          - name: macOS x86_64
            runner-os: macos-15
            artifact-name: tarwyn-${{ needs.init.outputs.version }}-macos-x86_64
            cargo-target: x86_64-apple-darwin

          - name: macOS aarch64
            runner-os: macos-15
            artifact-name: tarwyn-${{ needs.init.outputs.version }}-macos-aarch64
            cargo-target: aarch64-apple-darwin

    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.cargo-target }}

      # The JNI shim is compiled from generated C, so this runner needs a JDK
      # as well as a C compiler.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Build binary
        run: |
          cargo build \
          --locked --all-features \
          --release --target ${{ matrix.cargo-target }}

      - name: Create release archive
        run: ./scripts/zip-release.sh ${{ matrix.cargo-target }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: release.zip
          if-no-files-found: error

      - name: Install BoltFFI
        run: cargo install boltffi_cli --locked

      - name: Build the natives the jar carries
        working-directory: bindings
        run: boltffi pack java --release

      - name: Upload the native libraries for the jar
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.artifact-name }}
          path: bindings/dist/java/native/*/*
          if-no-files-found: error

  release-jar:
    name: Release (jar)
    runs-on: ubuntu-latest
    needs: ["init", "dry-run", "build"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Download every native
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./collected

      - name: Lay the natives out for packaging
        run: |
          version="${{ needs.init.outputs.version }}"
          for directory in ./collected/native-tarwyn-"$version"-*; do
            platform="${directory##*-$version-}"
            mkdir -p "clients/java/natives/$platform"
            # Two libraries per platform: the Rust cdylib and its JNI shim.
            find "$directory" -type f ! -name '*.sha256' \
              -exec cp {} "clients/java/natives/$platform/" \;
          done
          find clients/java/natives -type f | sort

      - name: Build the jar
        run: ./gradlew jar

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: tarwyn-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release-github:
    name: Release (GitHub)
    runs-on: ubuntu-latest
    needs: ["init", "dry-run", "build", "release-jar"]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Download release
        uses: actions/download-artifact@v8
        with:
          path: ./release

      - name: Unpack release
        run: ./scripts/unpack-release.sh "./release"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.init.outputs.version }}
          tag_name: v${{ needs.init.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            ./release/*.zip
            ./release/tarwyn-jar/*.jar
          draft: true

  release-crates:
    name: Release (crates.io)
    runs-on: ubuntu-latest
    needs: ["init", "dry-run", "build"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Publish crates
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
        with:
          dry-run: false
          check-repo: true
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
