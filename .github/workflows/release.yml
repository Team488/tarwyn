name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get version from manifest
        id: get_version
        run: echo "value=$(./scripts/get-version.sh)" >> $GITHUB_OUTPUT

  dry-run:
    name: Dry-run
    needs: ["init"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/rust
        with:
          cache-key: release-dry-run

      - name: Publish (dry-run)
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b
        with:
          dry-run: true
          check-repo: true
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    needs: ["init", "dry-run"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            platform: linux-x86_64

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            platform: linux-aarch64

          - name: macOS x86_64
            runner-os: macos-15-intel
            cargo-target: x86_64-apple-darwin
            platform: darwin-x86_64

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            platform: darwin-arm64

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "25"

      - name: Install Rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.cargo-target }}
          cache-key: release-${{ matrix.cargo-target }}

      - name: Install BoltFFI
        uses: ./.github/actions/cargo-install
        with:
          crate: boltffi_cli
          version: 0.30.1

      - name: Build the workspace
        run: |
          cargo build \
            --locked --all-features \
            --release --target ${{ matrix.cargo-target }}

      - name: Create release archive
        run: ./scripts/zip-release.sh ${{ matrix.cargo-target }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarwyn-${{ needs.init.outputs.version }}-${{ matrix.platform }}
          path: release.zip
          if-no-files-found: error

      - name: pack java natives (unix)
        if: runner.os != 'Windows'
        working-directory: bindings
        run: boltffi pack java --release

      - name: pack java natives (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: bindings
        run: boltffi pack java --release

      - name: Upload the natives the jar carries
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: bindings/dist/java/native/${{ matrix.platform }}/*
          if-no-files-found: error

  release-jar:
    name: Release (jar)
    runs-on: ubuntu-latest
    needs: ["init", "dry-run", "build"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "25"
          cache: gradle

      - name: Download every native
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./collected

      - name: Lay the natives out for packaging
        run: |
          for directory in ./collected/native-*; do
            platform="${directory##*/native-}"
            mkdir -p "bindings/natives/$platform"
            cp "$directory"/* "bindings/natives/$platform/"
          done
          find bindings/natives -type f | sort

      - name: Build the jar
        run: ./gradlew jar -x boltffiPack

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: tarwyn-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release-github:
    name: Release (GitHub)
    runs-on: ubuntu-latest
    needs: ["init", "dry-run", "build", "release-jar"]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release
        uses: actions/download-artifact@v8
        with:
          path: ./release

      - name: Unpack release
        run: ./scripts/unpack-release.sh "./release"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.init.outputs.version }}
          tag_name: v${{ needs.init.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            ./release/*.zip
            ./release/tarwyn-jar/*.jar
          draft: true

  release-crates:
    name: Release (crates.io)
    runs-on: ubuntu-latest
    needs: ["init", "dry-run", "build"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/rust
        with:
          cache-key: release-crates

      - name: Publish crates
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b
        with:
          dry-run: false
          check-repo: true
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
