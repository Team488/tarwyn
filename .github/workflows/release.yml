name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.value }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: get version from manifest
        id: get_version
        run: echo "value=$(./scripts/get-version.sh)" >> $GITHUB_OUTPUT

  build:
    needs: ["init"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            native-file: libtarwyn_bindings.so

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            native-file: libtarwyn_bindings.so

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            platform: darwin-arm64
            native-file: libtarwyn_bindings.dylib

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            native-file: tarwyn_bindings.dll

    name: build - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.cargo-target }}
          cache-key: release-${{ matrix.cargo-target }}

      - name: install boltffi
        uses: ./.github/actions/cargo-install
        with:
          crate: boltffi_cli
          version: 0.30.1

      - name: build the workspace
        run: |
          cargo build \
            --locked --all-features \
            --release --target ${{ matrix.cargo-target }}

      - name: create release archive
        run: ./scripts/zip-release.sh ${{ matrix.cargo-target }}

      - name: upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarwyn-${{ needs.init.outputs.version }}-${{ matrix.platform }}
          path: release.zip
          if-no-files-found: error

      - name: pack java natives (unix)
        if: runner.os != 'Windows'
        working-directory: bindings
        run: boltffi pack java --release -v

      - name: pack java natives (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: bindings
        env:
          CL: /MD
        run: boltffi pack java --release -v

      - name: upload the natives the jar carries
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: bindings/generated/java/native/${{ matrix.platform }}/*
          if-no-files-found: error

      - name: upload the python cdylib
        uses: actions/upload-artifact@v7
        with:
          name: python-cdylib-${{ matrix.platform }}
          path: target/${{ matrix.cargo-target }}/release/${{ matrix.native-file }}
          if-no-files-found: error

  release-jar:
    name: release (jar)
    runs-on: ubuntu-latest
    needs: ["init", "build"]
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: download every native
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ./collected

      - name: arrange the natives into per-platform packaging dirs
        run: |
          for directory in ./collected/native-*; do
            platform="${directory##*/native-}"
            mkdir -p "bindings/natives/$platform"
            cp "$directory"/* "bindings/natives/$platform/"
          done
          find bindings/natives -type f | sort

      - name: build the jar
        run: ./gradlew jar -x boltffiPack

      - name: upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: tarwyn-jar
          path: build/libs/tarwyn-${{ needs.init.outputs.version }}.jar
          if-no-files-found: error

  release-python:
    name: release (python) - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    needs: ["init", "build"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            native-file: libtarwyn_bindings.so
          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            native-file: libtarwyn_bindings.so
          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            platform: darwin-arm64
            native-file: libtarwyn_bindings.dylib
          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            native-file: tarwyn_bindings.dll
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install boltffi
        uses: ./.github/actions/cargo-install
        with:
          crate: boltffi_cli
          version: 0.30.1

      - name: generate the python client
        working-directory: bindings
        run: boltffi generate python

      - name: install python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: download the cdylib for this platform
        uses: actions/download-artifact@v8
        with:
          name: python-cdylib-${{ matrix.platform }}
          path: target/${{ matrix.cargo-target }}/release

      - name: stage the native library
        working-directory: bindings/generated/python
        run: cp "../../../target/${{ matrix.cargo-target }}/release/${{ matrix.native-file }}" tarwyn/

      - name: install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.1

      - name: build the wheels
        working-directory: bindings/generated/python
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-* cp314-*
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_35
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_35
          CIBW_TEST_COMMAND: python -c "import tarwyn"
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: tarwyn-python-${{ matrix.platform }}
          path: bindings/generated/python/wheelhouse/*.whl
          if-no-files-found: error

  release-github:
    name: release (github)
    runs-on: ubuntu-latest
    needs: ["init", "build", "release-jar", "release-python"]
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: download release
        uses: actions/download-artifact@v8
        with:
          pattern: tarwyn-*
          path: ./release

      - name: unpack release
        run: ./scripts/unpack-release.sh "./release"

      - name: create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.init.outputs.version }}
          tag_name: v${{ needs.init.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            ./release/*.zip
            ./release/tarwyn-jar/tarwyn-${{ needs.init.outputs.version }}.jar
            ./release/tarwyn-python-*/*.whl
          draft: true
