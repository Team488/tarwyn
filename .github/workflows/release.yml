name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.value }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install rust
        uses: ./.github/actions/rust
        with:
          cache-key: xtask

      - name: get version from manifest
        id: get_version
        run: echo "value=$(cargo xtask version)" >> $GITHUB_OUTPUT

  build:
    needs: ["init"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            native-file: libtarwyn.so

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            native-file: libtarwyn.so

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            platform: darwin-arm64
            native-file: libtarwyn.dylib

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            native-file: tarwyn.dll

    name: build - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.cargo-target }}
          cache-key: release-${{ matrix.cargo-target }}

      - name: build the workspace
        run: |
          cargo build \
            --locked --all-features \
            --release --target ${{ matrix.cargo-target }}

      - name: package the server and the c++ client
        run: cargo xtask package ${{ matrix.cargo-target }} ${{ matrix.platform }} --out release

      - name: upload the release archives
        uses: actions/upload-artifact@v7.0.1
        with:
          name: archives-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

      - name: upload the natives the jar carries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: target/${{ matrix.cargo-target }}/release/${{ matrix.native-file }}
          if-no-files-found: error

  release-jar:
    name: release (jar)
    runs-on: ubuntu-latest
    needs: ["init", "build"]
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: download every native
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: ./collected

      - name: arrange the natives into per-platform packaging dirs
        run: |
          for directory in ./collected/native-*; do
            platform="${directory##*/native-}"
            mkdir -p "bindings/java/natives/$platform"
            cp "$directory"/* "bindings/java/natives/$platform/"
          done
          find bindings/java/natives -type f | sort

      - name: build the jar
        working-directory: bindings/java
        run: ./gradlew jar

      - name: upload the jar
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tarwyn-jar
          path: bindings/java/build/libs/tarwyn-${{ needs.init.outputs.version }}.jar
          if-no-files-found: error

  release-python:
    name: release (python) - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    needs: ["init", "build"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-24.04
            platform: linux-x86_64
          - name: Linux aarch64
            runner-os: ubuntu-24.04-arm
            platform: linux-aarch64
          - name: macOS aarch64
            runner-os: macos-15
            platform: darwin-arm64
          - name: Windows x86_64
            runner-os: windows-2022
            platform: windows-x86_64
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install rust
        uses: ./.github/actions/rust
        with:
          cache-key: release-python

      - name: install python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: build the wheel
        working-directory: bindings/python
        run: uvx maturin build --release --out wheels

      - name: check the wheel imports
        shell: bash
        run: uv run --no-project --with "$(ls bindings/python/wheels/*.whl)" python -c "import tarwyn"

      - name: upload the wheel
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tarwyn-python-${{ matrix.platform }}
          path: bindings/python/wheels/*.whl
          if-no-files-found: error

  release-github:
    name: release (github)
    runs-on: ubuntu-latest
    needs: ["init", "build", "release-jar", "release-python"]
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: download every release artifact
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: "{archives-*,tarwyn-jar,tarwyn-python-*}"
          path: ./release
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ needs.init.outputs.version }}
          tag_name: v${{ needs.init.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            ./release/*.zip
            ./release/tarwyn-${{ needs.init.outputs.version }}.jar
            ./release/*.whl
          draft: true
