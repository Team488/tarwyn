# MIT License https://github.com/rojo-rbx/rokit/blob/main/LICENSE.txt
name: CI

on:
  push:
    paths:
      - "**.rs"
      - "**.java"
      - "**.proto"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "clients/**"
      - "proto/**"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/**"
      - ".clang-tidy"
      - ".pre-commit-config.yaml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check the generated clients match clients/api.toml
        run: |
          cargo run -q -p codegen
          cargo fmt --all
          git diff --exit-code -- \
            ffi/src/generated.rs \
            clients/java/src/org/tarwyn/BaseTarwynClient.java \
            clients/python/src/generated.rs \
            clients/cpp/include/tarwyn_generated.hpp

  rust:
    needs: ["fmt"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            run-tests: true

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            run-tests: false

          - name: macOS x86_64
            runner-os: macos-15
            cargo-target: x86_64-apple-darwin
            run-tests: true

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            run-tests: true

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            run-tests: true

          - name: Windows aarch64
            runner-os: windows-11-arm
            cargo-target: aarch64-pc-windows-msvc
            run-tests: false

    name: Rust - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
          targets: ${{ matrix.cargo-target }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.cargo-target }}

      - name: Build workspace
        run: |
          cargo build \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }}

      - name: Lint workspace
        run: |
          cargo clippy \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }} \
            -- -D warnings

      - name: Test workspace
        if: matrix.run-tests == true
        run: |
          cargo test \
            --workspace \
            --locked --all-features

      - name: Build the documentation
        if: matrix.cargo-target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc \
            --workspace --no-deps \
            --locked --all-features

  java:
    # The jar carries natives for every platform and unpacks the right one at
    # runtime, so platform() and the extraction path only get exercised by
    # actually running on each. Linux alone left both untested off Linux.
    name: Java client (FFM) - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore the build cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: java-${{ matrix.os }}

      - name: Check the bindings, compile the client, package the jar
        run: ./gradlew build

      - name: Check the javadoc
        run: ./gradlew javadoc

      - name: Test the ring buffer across the Rust/Java boundary
        run: ./gradlew test

      - name: Check the header compiles as C17
        if: runner.os == 'Linux'
        run: gcc -std=c17 -I ffi/include -fsyntax-only -x c - <<< '#include <tarwyn.h>'

  cpp:
    name: C++ client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore the build cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: cpp-client

      - name: Build the native library
        run: cargo build --release -p tarwyn_ffi

      # WPILib builds SystemCore and Linux desktop with GCC, macOS with clang, so
      # both frontends are compilers a consuming team actually uses. They also
      # diagnose different things, which is the other reason to keep both.
      - name: Check the headers compile as C++17, C++20 and C++23
        run: |
          for compiler in g++ clang++; do
            for standard in c++17 c++20 c++23; do
              echo "== $compiler $standard"
              $compiler -std=$standard -I clients/cpp/include -I ffi/include \
                -Wall -Wextra -Werror -fsyntax-only -x c++ - <<< '#include <tarwyn.hpp>'
            done
          done

      - name: Lint the client
        run: |
          sudo apt-get update && sudo apt-get install -y clang-tidy clang
          clang-tidy clients/cpp/test/tarwyn_test.cpp -- \
            -std=c++20 -I clients/cpp/test -I clients/cpp/include -I ffi/include

      - name: Test the client under both compilers
        run: |
          for compiler in g++ clang++; do
            echo "== $compiler"
            $compiler -std=c++20 -I clients/cpp/test -I clients/cpp/include -I ffi/include \
              -Wall -Wextra clients/cpp/test/tarwyn_test.cpp -o cpp_test \
              -L target/release -ltarwyn_ffi -Wl,-rpath,$PWD/target/release -pthread
            ./cpp_test
          done

  python:
    name: Python client (PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore the build cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: python

      - name: Build the extension module
        run: cargo build --release -p tarwyn_python

      - name: Install pytest and ruff
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.5

      - name: Lint the client
        run: |
          python3 -m ruff check clients/python
          python3 -m ruff format --check clients/python

      - name: Test the client
        run: |
          cp target/release/libtarwyn.so tarwyn.so
          python3 -m pytest clients/python -q

  natives:
    # The rust job builds every target in debug. This one is the only place the
    # release profile is cross-compiled, and with lto = "fat" and
    # codegen-units = 1 that is a different link: the macOS and Windows failures
    # this branch already hit were both link errors.
    name: Native library (release) - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner-os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: natives-${{ matrix.cargo-target }}

      - name: Build the cdylib
        run: cargo build --release -p tarwyn_ffi --target ${{ matrix.cargo-target }}
