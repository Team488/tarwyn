name: CI

on:
  push:
    paths:
      - "**.rs"
      - "**.java"
      - "**.proto"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "clients/**"
      - "proto/**"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  rust:
    needs: ["fmt"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            run-tests: true

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            run-tests: false

          - name: macOS x86_64
            runner-os: macos-15
            cargo-target: x86_64-apple-darwin
            run-tests: true

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            run-tests: true

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            run-tests: true

          - name: Windows aarch64
            runner-os: windows-11-arm
            cargo-target: aarch64-pc-windows-msvc
            run-tests: false

    name: Rust - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.cargo-target }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cargo-target }}

      - name: Build workspace
        run: |
          cargo build \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }}

      - name: Lint workspace
        run: |
          cargo clippy \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }} \
            -- -D warnings

      - name: Test workspace
        if: matrix.run-tests == true
        run: |
          cargo test \
            --workspace \
            --locked --all-features

      - name: Build the documentation
        if: matrix.cargo-target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc \
            --workspace --no-deps \
            --locked --all-features

  java:
    name: Java client (FFM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore the build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: java

      - name: Check the bindings, compile the client, package the jar
        run: ./gradlew build

      - name: Check the javadoc
        run: ./gradlew javadoc

      - name: Test the ring buffer across the Rust/Java boundary
        run: ./gradlew test

      - name: Check the header compiles as C17
        run: gcc -std=c17 -I clients/ffi/include -fsyntax-only -x c - <<< '#include <tarwyn.h>'

  cpp:
    name: C++ client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore the build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cpp-client

      - name: Build the native library
        run: cargo build --release -p tarwyn_ffi

      - name: Check the headers compile as C++17, C++20 and C++23
        run: |
          for standard in c++17 c++20 c++23; do
            echo "== $standard"
            g++ -std=$standard -I clients/cpp/include -I clients/ffi/include \
              -Wall -Wextra -Werror -fsyntax-only -x c++ - <<< '#include <tarwyn.hpp>'
          done

      - name: Test the client
        run: |
          g++ -std=c++20 -I clients/cpp/include -I clients/ffi/include \
            -Wall -Wextra clients/cpp/test/tarwyn_test.cpp -o cpp_test \
            -L target/release -ltarwyn_ffi -Wl,-rpath,$PWD/target/release -pthread
          ./cpp_test

  python:
    name: Python client (PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore the build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: python

      - name: Build the extension module
        run: cargo build --release -p tarwyn_python

      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Test the client
        run: |
          cp target/release/libtarwyn.so tarwyn.so
          python3 -m pytest clients/python -q

  natives:
    name: Native library - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner-os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: natives-${{ matrix.cargo-target }}

      - name: Build the cdylib
        run: cargo build --release -p tarwyn_ffi --target ${{ matrix.cargo-target }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: tarwyn-ffi-${{ matrix.cargo-target }}
          path: |
            target/${{ matrix.cargo-target }}/release/*tarwyn_ffi*
          if-no-files-found: error
