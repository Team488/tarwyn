name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust || github.event_name == 'workflow_dispatch' }}
      java: ${{ steps.filter.outputs.java || github.event_name == 'workflow_dispatch' }}
      python: ${{ steps.filter.outputs.python || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Work out which languages are affected
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/config.toml'
              - 'proto/**'
              - 'bindings/**'
            rust:
              - *shared
              - 'core/**'
              - 'client/**'
              - 'bench/**'
              - 'scripts/**'
            java:
              - *shared
              - 'core/**'
              - 'client/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew*'
            python:
              - *shared
              - 'core/**'
              - 'client/**'

  fmt:
    name: Check formatting
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Install BoltFFI
        run: cargo install boltffi_cli --locked

      - name: Check the committed clients match bindings/src/lib.rs
        working-directory: bindings
        run: |
          boltffi generate java
          boltffi generate python
          git diff --exit-code -- dist/

  rust:
    needs: ["changes", "fmt"]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            run-tests: true

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            run-tests: false

          - name: macOS x86_64
            runner-os: macos-15
            cargo-target: x86_64-apple-darwin
            run-tests: true

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            run-tests: true

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            run-tests: true

          - name: Windows aarch64
            runner-os: windows-11-arm
            cargo-target: aarch64-pc-windows-msvc
            run-tests: false

    name: Rust - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
          targets: ${{ matrix.cargo-target }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.cargo-target }}

      - name: Build workspace
        run: |
          cargo build \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }}

      - name: Lint workspace
        run: |
          cargo clippy \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }} \
            -- -D warnings

      - name: Test workspace
        if: matrix.run-tests == true
        run: |
          cargo test \
            --workspace \
            --locked --all-features

      - name: Build the documentation
        if: matrix.cargo-target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc \
            --workspace --no-deps \
            --locked --all-features

  java:
    name: Java client (generated) - ${{ matrix.os }}
    needs: ["changes"]
    if: needs.changes.outputs.java == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: java-${{ matrix.os }}

      - name: Install BoltFFI
        run: cargo install boltffi_cli --locked

      - name: Clean stale native
        if: matrix.os == 'windows-latest'
        run: cargo clean -p tarwyn_bindings

      - name: Compile Java
        run: ./gradlew compileJava

      - name: Run Java tests
        run: ./gradlew test

      - name: Package jar
        run: ./gradlew jar

      - name: Check the javadoc
        run: ./gradlew javadoc

  python:
    name: Python client (generated) - ${{ matrix.python }}
    needs: ["changes"]
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: python-${{ matrix.python }}

      - name: Install BoltFFI
        run: cargo install boltffi_cli --locked

      - name: Generate and build the extension
        working-directory: bindings
        run: |
          boltffi generate python
          cargo build --release -p tarwyn_bindings
          cp ../target/release/libtarwyn_bindings.so dist/python/tarwyn/
          cd dist/python && uv run --with setuptools python setup.py build_ext --inplace

      - name: Lint the tests
        working-directory: bindings
        run: |
          uv run --with ruff ruff check tests/python
          uv run --with ruff ruff format --check tests/python

      - name: Test the client
        working-directory: bindings
        env:
          PYTHONPATH: dist/python
        run: uv run --with pytest pytest tests/python -q

  natives:
    name: Native library (release) - ${{ matrix.name }}
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner-os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: natives-${{ matrix.cargo-target }}

      - name: Build the cdylib
        run: cargo build --release -p tarwyn_bindings --target ${{ matrix.cargo-target }}
