name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust || github.event_name == 'workflow_dispatch' }}
      java: ${{ steps.filter.outputs.java || github.event_name == 'workflow_dispatch' }}
      python: ${{ steps.filter.outputs.python || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: work out which languages are affected
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/config.toml'
              - 'deny.toml'
              - 'proto/**'
              - 'bindings/**'
            rust:
              - *shared
              - 'core/**'
              - 'client/**'
              - 'bench/**'
              - 'xtask/**'
            java:
              - *shared
              - 'core/**'
              - 'client/**'
            python:
              - *shared
              - 'core/**'
              - 'client/**'
              - 'bench/python/**'

  fmt:
    name: Check formatting
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: rustfmt

      - name: check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: Check the declared minimum Rust version
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install the minimum rust the manifests declare
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.88"

      - name: check the workspace builds on it
        run: cargo check --workspace --locked --all-features --all-targets

  deny:
    name: Audit dependencies and licences
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: check advisories, licences and sources with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.1.1

  cpp:
    name: C and C++ Clients
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      WPILIB_VERSION: 2027.0.0-alpha-7
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install rust
        uses: ./.github/actions/rust
        with:
          cache-key: cpp

      - name: build the c abi and its header
        run: cargo build -p tarwyn-c --release

      - name: check the committed header matches the c abi
        run: git diff --exit-code -- bindings/c/include/tarwyn.h

      - name: fetch the wpimath headers the c++ client includes
        run: |
          mkdir -p wpilib/include
          curl -sSL -o wpimath.zip \
            "https://frcmaven.wpi.edu/artifactory/release/org/wpilib/wpimath/wpimath-cpp/${WPILIB_VERSION}/wpimath-cpp-${WPILIB_VERSION}-headers.zip"
          curl -sSL -o wpiutil.zip \
            "https://frcmaven.wpi.edu/artifactory/release/org/wpilib/wpiutil/wpiutil-cpp/${WPILIB_VERSION}/wpiutil-cpp-${WPILIB_VERSION}-headers.zip"
          unzip -qo wpimath.zip -d wpilib/include
          unzip -qo wpiutil.zip -d wpilib/include

      - name: build and run the c and c++ tests
        run: |
          cmake -S bindings/cpp -B build/cpp -DWPILIB_INCLUDE_DIR="${{ github.workspace }}/wpilib/include"
          cmake --build build/cpp
          LD_LIBRARY_PATH="${{ github.workspace }}/target/release" ctest --test-dir build/cpp --output-on-failure

  rust:
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc

    name: Rust - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.cargo-target }}
          components: clippy
          cache-key: ${{ matrix.cargo-target }}

      - name: build the rust workspace
        run: |
          cargo build \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }}

      - name: lint the rust workspace with clippy
        run: |
          cargo clippy \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }} \
            -- -D warnings

      - name: test the rust workspace
        run: |
          cargo test \
            --workspace \
            --locked --all-features --no-fail-fast \
            --target ${{ matrix.cargo-target }}

      - name: build the documentation
        if: matrix.cargo-target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc \
            --workspace --no-deps \
            --locked --all-features \
            --target ${{ matrix.cargo-target }}

  natives:
    name: Server Binary - ${{ matrix.name }}
    needs: ["changes"]
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            server-file: tarwyn_server

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            server-file: tarwyn_server

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            platform: darwin-arm64
            server-file: tarwyn_server

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            server-file: tarwyn_server.exe

    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.cargo-target }}
          cache-key: natives-${{ matrix.cargo-target }}

      - name: build the server the protocol suite runs against
        run: cargo build -p tarwyn_server --release --target ${{ matrix.cargo-target }}

      - name: upload the server binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-${{ matrix.platform }}
          path: target/${{ matrix.cargo-target }}/release/${{ matrix.server-file }}
          if-no-files-found: error

  java:
    name: Java Client - ${{ matrix.name }}
    needs: ["changes"]
    if: needs.changes.outputs.java == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            platform: linux-x86_64
          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            platform: linux-aarch64
          - name: macOS aarch64
            runner-os: macos-15
            platform: darwin-arm64
          - name: Windows x86_64
            runner-os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: install rust
        uses: ./.github/actions/rust
        with:
          cache-key: java-${{ matrix.platform }}

      - name: build the java client with gradlew
        working-directory: bindings/java
        run: ./gradlew build javadoc

  python:
    name: Python Client - ${{ matrix.name }}
    needs: ["changes", "natives"]
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-24.04
            platform: linux-x86_64
            server-file: tarwyn_server
          - name: Linux aarch64
            runner-os: ubuntu-24.04-arm
            platform: linux-aarch64
            server-file: tarwyn_server
          - name: macOS aarch64
            runner-os: macos-15
            platform: darwin-arm64
            server-file: tarwyn_server
          - name: Windows x86_64
            runner-os: windows-2022
            platform: windows-x86_64
            server-file: tarwyn_server.exe
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1

      - name: install python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: install rust
        uses: ./.github/actions/rust
        with:
          cache-key: python-${{ matrix.platform }}

      - name: check the python tests with ruff
        if: matrix.platform == 'linux-x86_64'
        working-directory: bindings/python
        run: uv run --group dev ruff check .

      - name: format-check the python tests with ruff
        if: matrix.platform == 'linux-x86_64'
        working-directory: bindings/python
        run: uv run --group dev ruff format --check .

      - name: check the bench harness with ruff
        if: matrix.platform == 'linux-x86_64'
        working-directory: bench/python
        run: uvx ruff@0.16.8 check .

      - name: format-check the bench harness with ruff
        if: matrix.platform == 'linux-x86_64'
        working-directory: bench/python
        run: uvx ruff@0.16.8 format --check .

      - name: run the python test suite with pytest
        working-directory: bindings/python
        run: uv run --group dev pytest tests --ignore=tests/protocol -q

      - name: download the server binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: server-${{ matrix.platform }}
          path: ./server

      - name: run the nt4 protocol suite against wpilib ntcore
        working-directory: bindings/python
        shell: bash
        env:
          TARWYN_SERVER_BIN: ${{ github.workspace }}/server/${{ matrix.server-file }}
        run: |
          chmod +x "$TARWYN_SERVER_BIN"
          uv run --group dev pytest tests/protocol -q
  conclusion:
    name: Conclusion
    needs: ["changes", "fmt", "msrv", "deny", "cpp", "rust", "natives", "java", "python"]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check every job either succeeded or was filtered out
        env:
          needs: ${{ toJson(needs) }}
        run: |
          jq -C <<< "${needs}"
          passed=$(jq -r 'all(.result as $result | ["success", "skipped"] | contains([$result]))' <<< "${needs}")
          [ "$passed" = "true" ]
