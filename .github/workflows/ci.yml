name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust || github.event_name == 'workflow_dispatch' }}
      java: ${{ steps.filter.outputs.java || github.event_name == 'workflow_dispatch' }}
      python: ${{ steps.filter.outputs.python || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: work out which languages are affected
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/config.toml'
              - 'proto/**'
              - 'bindings/**'
            rust:
              - *shared
              - 'core/**'
              - 'client/**'
              - 'bench/**'
              - 'scripts/**'
            java:
              - *shared
              - 'core/**'
              - 'client/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew*'
            python:
              - *shared
              - 'core/**'
              - 'client/**'

  fmt:
    name: Check formatting
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt

      - name: check formatting
        run: cargo fmt --all -- --check

  codegen:
    name: Validate generated clients
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install rust
        uses: ./.github/actions/rust
        with:
          cache-key: codegen

      - name: install boltffi
        uses: ./.github/actions/cargo-install
        with:
          crate: boltffi_cli
          version: 0.30.1

      - name: generate the java client from the bindings
        working-directory: bindings
        run: boltffi generate java

      - name: generate the python client from the bindings
        working-directory: bindings
        run: boltffi generate python

      - name: verify generated clients exist
        working-directory: bindings
        run: |
          test -f generated/java/org/tarwyn/Tarwyn.java
          test -f generated/python/tarwyn/__init__.py

  rust:
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc

    name: Rust - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.cargo-target }}
          components: clippy
          cache-key: ${{ matrix.cargo-target }}

      - name: build the rust workspace
        run: |
          cargo build \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }}

      - name: lint the rust workspace with clippy
        run: |
          cargo clippy \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }} \
            -- -D warnings

      - name: test the rust workspace
        run: |
          cargo test \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }}

      - name: build the documentation
        if: matrix.cargo-target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc \
            --workspace --no-deps \
            --locked --all-features \
            --target ${{ matrix.cargo-target }}

  natives:
    name: Native library - ${{ matrix.name }}
    needs: ["changes"]
    if: |
      needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.java == 'true'
      || needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            platform: linux-x86_64

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            platform: linux-aarch64

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            platform: darwin-arm64

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.cargo-target }}
          cache-key: natives-${{ matrix.cargo-target }}

      - name: install boltffi
        uses: ./.github/actions/cargo-install
        with:
          crate: boltffi_cli
          version: 0.30.1

      - name: pack java natives (unix)
        if: runner.os != 'Windows'
        working-directory: bindings
        run: boltffi pack java --release -v

      - name: pack java natives (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: bindings
        env:
          CL: /MD
        run: boltffi pack java --release -v

      - name: list the packed java native files
        if: runner.os != 'Windows'
        working-directory: bindings
        run: ls -la generated/java/native/${{ matrix.platform }}/

      - name: upload the java natives as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: bindings/generated/java/native/${{ matrix.platform }}/*
          if-no-files-found: error

      - name: upload the Python cdylib
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: python-cdylib-linux-x86_64
          path: target/${{ matrix.cargo-target }}/release/libtarwyn_bindings.so
          if-no-files-found: error

      - name: build the server for the protocol suite
        if: matrix.platform == 'linux-x86_64'
        run: cargo build -p tarwyn_server --release --target ${{ matrix.cargo-target }}

      - name: upload the server binary
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: server-linux-x86_64
          path: target/${{ matrix.cargo-target }}/release/tarwyn_server
          if-no-files-found: error

  java:
    name: java client - ${{ matrix.name }}
    needs: ["changes", "natives"]
    if: needs.changes.outputs.java == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            platform: linux-x86_64
          - name: macOS aarch64
            runner-os: macos-15
            platform: darwin-arm64
          - name: Windows x86_64
            runner-os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: install boltffi
        uses: ./.github/actions/cargo-install
        with:
          crate: boltffi_cli
          version: 0.30.1

      - name: generate the java client
        working-directory: bindings
        run: boltffi generate java

      - name: download the natives this platform loads
        uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.platform }}
          path: bindings/generated/java/native/${{ matrix.platform }}

      - name: build the java client with gradlew
        run: ./gradlew build javadoc -x boltffiPack

  python:
    name: python client
    needs: ["changes", "natives"]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: install boltffi
        uses: ./.github/actions/cargo-install
        with:
          crate: boltffi_cli
          version: 0.30.1

      - name: generate the python client
        working-directory: bindings
        run: boltffi generate python

      - name: download the natives
        uses: actions/download-artifact@v8
        with:
          name: python-cdylib-linux-x86_64
          path: ./collected

      - name: copy the cdylib into the python extension package
        run: cp ./collected/libtarwyn_bindings.so bindings/generated/python/tarwyn/

      - name: check the python tests with ruff
        working-directory: bindings
        run: uv run --group dev ruff check tests

      - name: format-check the python tests with ruff
        working-directory: bindings
        run: uv run --group dev ruff format --check tests

      - name: build the python extension in place
        working-directory: bindings/generated/python
        run: uv run --with setuptools python setup.py build_ext --inplace

      - name: run the python test suite with pytest
        working-directory: bindings
        env:
          PYTHONPATH: generated/python
        run: uv run --group dev pytest tests/python -q

      - name: download the server binary
        uses: actions/download-artifact@v8
        with:
          name: server-linux-x86_64
          path: ./server

      - name: run the nt4 protocol suite against wpilib ntcore
        working-directory: bindings
        env:
          TARWYN_SERVER_BIN: ${{ github.workspace }}/server/tarwyn_server
        run: |
          chmod +x "$TARWYN_SERVER_BIN"
          uv run --group dev pytest tests/protocol -q

  conclusion:
    name: conclusion
    needs: ["changes", "fmt", "codegen", "rust", "natives", "java", "python"]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check every job either succeeded or was filtered out
        env:
          needs: ${{ toJson(needs) }}
        run: |
          jq -C <<< "${needs}"
          passed=$(jq -r 'all(.result as $result | ["success", "skipped"] | contains([$result]))' <<< "${needs}")
          [ "$passed" = "true" ]
