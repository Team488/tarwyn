name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust || github.event_name == 'workflow_dispatch' }}
      java: ${{ steps.filter.outputs.java || github.event_name == 'workflow_dispatch' }}
      cpp: ${{ steps.filter.outputs.cpp || github.event_name == 'workflow_dispatch' }}
      python: ${{ steps.filter.outputs.python || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Work out which languages are affected
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/config.toml'
              - 'proto/**'
              - 'codegen/**'
              - 'clients/api.toml'
            rust:
              - *shared
              - 'core/**'
              - 'clients/rust/**'
              - 'clients/python/**'
              - 'ffi/**'
              - 'bench/**'
              - 'scripts/**'
            java:
              - *shared
              - 'core/**'
              - 'clients/rust/**'
              - 'ffi/**'
              - 'clients/java/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew*'
            cpp:
              - *shared
              - 'core/**'
              - 'clients/rust/**'
              - 'ffi/**'
              - 'clients/cpp/**'
              - '.clang-tidy'
              - 'build.gradle'
              - 'gradle.properties'
            python:
              - *shared
              - 'clients/rust/**'
              - 'clients/python/**'

  fmt:
    name: Check formatting
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: codegen

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check the generated clients match clients/api.toml
        run: |
          cargo run -q -p codegen
          cargo fmt --all
          git diff --exit-code -- \
            ffi/src/generated.rs \
            clients/java/src/org/tarwyn/BaseTarwynClient.java \
            clients/python/src/generated.rs \
            clients/cpp/include/tarwyn_generated.hpp

  rust:
    needs: ["changes", "fmt"]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
            run-tests: true

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
            run-tests: false

          - name: macOS x86_64
            runner-os: macos-15
            cargo-target: x86_64-apple-darwin
            run-tests: true

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
            run-tests: true

          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
            run-tests: true

          - name: Windows aarch64
            runner-os: windows-11-arm
            cargo-target: aarch64-pc-windows-msvc
            run-tests: false

    name: Rust - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
          targets: ${{ matrix.cargo-target }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.cargo-target }}

      - name: Build workspace
        run: |
          cargo build \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }}

      - name: Lint workspace
        run: |
          cargo clippy \
            --workspace \
            --locked --all-features \
            --target ${{ matrix.cargo-target }} \
            -- -D warnings

      - name: Test workspace
        if: matrix.run-tests == true
        run: |
          cargo test \
            --workspace \
            --locked --all-features

      - name: Build the documentation
        if: matrix.cargo-target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc \
            --workspace --no-deps \
            --locked --all-features

  java:
    name: Java client (FFM) - ${{ matrix.os }}
    needs: ["changes"]
    if: needs.changes.outputs.java == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: java-${{ matrix.os }}

      - name: Compile the client, run the tests, package the jar
        run: ./gradlew build -x checkBindings

      - name: Check the committed bindings match the header
        if: runner.os == 'Linux'
        run: ./gradlew checkBindings

      - name: Check the javadoc
        run: ./gradlew javadoc

      - name: Check the header compiles as C17
        if: runner.os == 'Linux'
        run: gcc -std=c17 -I ffi/include -fsyntax-only -x c - <<< '#include <tarwyn.h>'

  cpp:
    name: C++ client
    needs: ["changes"]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cpp-client

      - name: Fetch the pinned Boost.UT header
        run: ./gradlew fetchBoostUt

      - name: Build the native library
        run: cargo build --release -p tarwyn_ffi

      - name: Check the headers compile as C++17, C++20 and C++23
        run: |
          for compiler in g++ clang++; do
            for standard in c++17 c++20 c++23; do
              echo "== $compiler $standard"
              $compiler -std=$standard -I clients/cpp/include -I ffi/include \
                -Wall -Wextra -Werror -fsyntax-only -x c++ - <<< '#include <tarwyn.hpp>'
            done
          done

      - name: Lint the client
        run: |
          sudo apt-get update && sudo apt-get install -y clang-tidy clang
          clang-tidy clients/cpp/test/tarwyn_test.cpp -- \
            -std=c++20 -I build/vendor -I clients/cpp/test -I clients/cpp/include -I ffi/include

      - name: Test the client under both compilers
        run: |
          for compiler in g++ clang++; do
            echo "== $compiler"
            $compiler -std=c++20 -I build/vendor -I clients/cpp/test -I clients/cpp/include \
              -I ffi/include -Wall -Wextra clients/cpp/test/tarwyn_test.cpp -o cpp_test \
              -L target/release -ltarwyn_ffi -Wl,-rpath,$PWD/target/release -pthread
            ./cpp_test
          done

  msvc:
    name: C++ client (MSVC)
    needs: ["changes"]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cpp-msvc

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Fetch the pinned Boost.UT header
        run: ./gradlew fetchBoostUt

      - name: Build the native library
        run: cargo build --release -p tarwyn_ffi

      - name: Put cl.exe on PATH
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Check the header compiles under MSVC
        shell: pwsh
        run: |
          Set-Content probe.cpp "#include <tarwyn.hpp>`nint main() { return 0; }"
          cl /nologo /std:c++20 /permissive- /EHsc /W4 /WX `
             /I clients\cpp\include /I ffi\include /c probe.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and run the test suite under MSVC
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /permissive- /EHsc /Zc:preprocessor `
             /I build\vendor /I clients\cpp\test /I clients\cpp\include /I ffi\include `
             clients\cpp\test\tarwyn_test.cpp /Fe:cpp_test.exe `
             /link target\release\tarwyn_ffi.dll.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\tarwyn_ffi.dll .
          .\cpp_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  python:
    name: Python client (PyO3)
    needs: ["changes"]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: python

      - name: Build the extension module
        run: cargo build --release -p tarwyn_python

      - name: Install pytest and ruff
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.5

      - name: Lint the client
        run: |
          python3 -m ruff check clients/python
          python3 -m ruff format --check clients/python

      - name: Test the client
        run: |
          cp target/release/libtarwyn.so tarwyn.so
          python3 -m pytest clients/python -q

  miri:
    name: Miri (unsafe surface)
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
          components: miri

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: miri

      - name: Check the wire format and the log writer
        run: cargo miri test -p tarwyn_protobuf

      - name: Check the C ABI pointer and ring handling
        run: |
          cargo miri test -p tarwyn_ffi -- \
            --skip client_lifecycle_and_publish \
            --skip get_reports_missing_value_rather_than_blocking \
            --skip ring_subscription_exposes_base_and_index \
            --skip closing_a_telemetry_subscription_reports_success

  natives:
    name: Native library (release) - ${{ matrix.name }}
    needs: ["changes"]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner-os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: natives-${{ matrix.cargo-target }}

      - name: Build the cdylib
        run: cargo build --release -p tarwyn_ffi --target ${{ matrix.cargo-target }}
