name: Clients

on:
  push:
    paths:
      - "clients/**"
      - "proto/**"
      - ".github/workflows/clients.yml"
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  java:
    name: Java client (FFM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build the native library
        run: cargo build --release -p tarwyn_ffi

      - name: Check the committed bindings match the header
        run: |
          curl -sL -o jextract.tar.gz \
            https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz
          tar xzf jextract.tar.gz
          ./jextract-25/bin/jextract \
            --output /tmp/gen \
            --target-package org.tarwyn.ffi \
            @clients/java-client/jextract.args \
            clients/ffi/include/tarwyn.h
          diff -r /tmp/gen clients/java-client/gen

      - name: Fetch ntcore, which NtBridge compiles against
        run: |
          mkdir -p lib
          base=https://frcmaven.wpi.edu/artifactory/release/edu/wpi/first
          curl -sL -o lib/ntcore.jar $base/ntcore/ntcore-java/2026.1.1/ntcore-java-2026.1.1.jar
          curl -sL -o lib/wpiutil.jar $base/wpiutil/wpiutil-java/2026.1.1/wpiutil-java-2026.1.1.jar

      - name: Compile the client
        run: |
          javac -cp lib/ntcore.jar:lib/wpiutil.jar -d clients/java-client/out \
            $(find clients/java-client/gen -name '*.java') \
            clients/java-client/src/*.java

      - name: Soak the ring buffer across the Rust/Java boundary
        run: |
          cargo build --release -p tarwyn_server
          ./target/release/tarwyn_server > /dev/null 2>&1 &
          sleep 2
          java -cp clients/java-client/out RingSoak \
            target/release/libtarwyn_ffi.so 8 5000

      - name: Check the header compiles as C17
        run: gcc -std=c17 -I clients/ffi/include -fsyntax-only -x c - <<< '#include <tarwyn.h>'

  python:
    name: Python client (PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the extension module
        run: cargo build --release -p tarwyn_python

      - name: Check the module imports
        run: |
          cp target/release/libtarwyn.so tarwyn.so
          python3 -c "import tarwyn; tarwyn.TarwynClient(host='127.0.0.1')"

  natives:
    name: Native library - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu
          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin
          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner-os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Build the cdylib
        run: cargo build --release -p tarwyn_ffi --target ${{ matrix.cargo-target }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tarwyn-ffi-${{ matrix.cargo-target }}
          path: |
            target/${{ matrix.cargo-target }}/release/*tarwyn_ffi*
          if-no-files-found: error
