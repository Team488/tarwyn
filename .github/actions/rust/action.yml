name: Rust toolchain
description: Installs the pinned stable toolchain and restores this job's build cache.

inputs:
  targets:
    description: Comma separated target triples to add.
    required: false
    default: ""
  components:
    description: Comma separated rustup components to add.
    required: false
    default: ""
  cache-key:
    description: Suffix separating this job's cache from every other job's.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: stable
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        key: ${{ inputs.cache-key }}
