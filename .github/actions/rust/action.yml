name: Rust toolchain
description: Installs the floating stable toolchain and restores this job's build cache.

inputs:
  targets:
    description: Comma separated target triples to add.
    required: false
    default: ""
  components:
    description: Comma separated rustup components to add.
    required: false
    default: ""
  cache-key:
    description: Suffix separating this job's cache from every other job's.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
      with:
        toolchain: stable
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      with:
        key: ${{ inputs.cache-key }}
